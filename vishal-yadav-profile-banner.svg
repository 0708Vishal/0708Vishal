    <clipPath id="screen"><rect x="28" y="28" width="1544" height="944" rx="24"/></clipPath>
    <style>
      .ui{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'Courier New',monospace}.eyebrow{fill:#73dced;font-size:12px;font-weight:700;letter-spacing:2.8px}.heading{fill:#eff6ff;font-size:17px;font-weight:700}.body{fill:#b6c7de;font-size:14px}.tiny{fill:#839ab8;font-size:11px}.card{fill:url(#panel);stroke:#315076;stroke-width:1}.rule{stroke:#385679;stroke-width:1}.gridMove{animation:gridMove 22s linear infinite}.scan{animation:scan 9s linear infinite}.cursor{animation:blink 1.05s step-end infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.fade{animation:fade 5s ease-in-out infinite}.packet{stroke-dasharray:9 180;animation:packet 7s linear infinite}@keyframes gridMove{from{transform:translate(-72px,-72px)}to{transform:translate(0,0)}}@keyframes scan{0%{transform:translateY(-80px);opacity:0}10%,85%{opacity:.75}100%{transform:translateY(1080px);opacity:0}}@keyframes blink{50%{opacity:0}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes fade{0%,100%{opacity:.42}50%{opacity:1}}@keyframes packet{to{stroke-dashoffset:-189}}@media (prefers-reduced-motion:reduce){.gridMove,.scan,.cursor,.pulse,.fade,.packet{animation:none}}
    </style>
