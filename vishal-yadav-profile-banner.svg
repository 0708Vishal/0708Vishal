    <radialGradient id="ambient" cx="58%" cy="24%" r="68%"><stop stop-color="#15578a" stop-opacity=".28"/><stop offset=".55" stop-color="#23205b" stop-opacity=".12"/><stop offset="1" stop-color="#070b16" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#57cde5"/><stop offset=".58" stop-color="#5995e6"/><stop offset="1" stop-color="#8b73cc"/></linearGradient>
